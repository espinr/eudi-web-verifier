<div>
  <div class="result-container">

    <!-- licensing by iconisme from <a href="https://thenounproject.com/browse/icons/term/licensing/" target="_blank" title="licensing Icons">Noun Project</a> (CC BY 3.0)
     Health by Graphtend from <a href="https://thenounproject.com/browse/icons/term/health/" target="_blank" title="Health Icons">Noun Project</a> (CC BY 3.0) 
     -->

    <ng-container *ngFor="let entry of attestationsPerQuery | keyvalue; let indexOfelement=index;">
      <mat-expansion-panel expanded="true">
        <mat-expansion-panel-header>
          <mat-panel-title><span>For query #{{ indexOfelement }}:</span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <ng-container *ngIf="entry.value | async as attestations">
          <div>
            Received <strong>{{ attestations.length }}</strong> document with attestations
          </div>
          <div class="result-container">
            <ng-container *ngFor="let attestation of attestations">
              <mat-card *ngIf="isErrored(attestation)" appearance="outlined">
                <mat-card-header>
                  <div mat-card-avatar class="header-image"></div>
                  <mat-card-title
                    >Error: {{ attestation.reason }}</mat-card-title
                  >
                  <mat-card-subtitle>
                    in <i> {{ attestation.format }} </i> format
                  </mat-card-subtitle
                  >
                </mat-card-header>
              </mat-card>

              <ng-container *ngIf="!isErrored(attestation)" appearance="outlined">                
                <vc-view-attestation [attestation]="attestation"></vc-view-attestation>
              </ng-container>
            </ng-container>
          </div>
        </ng-container>
      </mat-expansion-panel>  
    </ng-container>

    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Claims requested in JSON...</mat-panel-title>
      </mat-expansion-panel-header>
      <vc-editor [editable]="false" [code]="presentationQuery"></vc-editor>
    </mat-expansion-panel>

    <div class="documents-and-log">
      <span>...and the interaction with the wallet...</span>
      <a mat-button (click)="openLogs()">logs</a>
    </div>

  </div>
</div>
